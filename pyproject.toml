[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-tool-guard"
version = "0.1.0"
description = "Runtime security firewall, secret/injection filter, and transparent stdio MCP proxy for AI agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
authors = [
  { name = "mcp-tool-guard contributors" }
]
keywords = ["mcp", "ai-security", "agent-firewall", "prompt-injection", "dlp", "ssrf"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]

[project.scripts]
mcp-tool-guard = "mcp_tool_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
